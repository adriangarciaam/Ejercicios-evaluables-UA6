services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DEBUG: "1"
      ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
